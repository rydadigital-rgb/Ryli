    <script>
      // Suppress benign platform Vite HMR websocket reconnection noise
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.toLowerCase().includes('websocket') || msg.toLowerCase().includes('vite')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event.message || (event.error && event.error.message) || '') + '';
        if (msg.toLowerCase().includes('websocket') || msg.toLowerCase().includes('vite')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-blue-500 selection:text-white">

  </body>
